name: Supply Chain Security

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1. Install dependencies so node_modules exists
      - name: Install Dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      # 2. Install Syft and Grype CLIs directly (bypasses GitHub Action wrapper bugs)
      - name: Install Syft and Grype CLIs
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      # 3. Force Syft to scan node_modules directly without ignoring gitignored folders
      - name: Generate Full SBOM
        run: syft dir:./node_modules --exclude "" -o spdx-json=juiceshop.sbom.json

      # 4. Upload raw SBOM artifact for download/verification
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juiceshop-sbom
          path: juiceshop.sbom.json

      # 5. Scan the complete SBOM with Grype and output a valid SARIF file
      - name: Scan SBOM with Grype
        run: grype sbom:juiceshop.sbom.json -o sarif > results.sarif
        continue-on-error: true

      # 6. Upload SARIF results to GitHub Security tab
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: "grype-sbom"
      # 7. Also export Grype results as JSON for PDF generation
      - name: Scan SBOM with Grype (JSON)
        run: grype sbom:juiceshop.sbom.json -o json > grype-results.json
        continue-on-error: true

      # 8. Set up Python and generate PDF Report (High & Critical only)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ReportLab
        run: pip install reportlab

      - name: Generate PDF Report Script
        run: |
          python - << 'EOF'
          import json
          from reportlab.lib.pagesizes import letter
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib import colors

          try:
              with open('grype-results.json') as f:
                  data = json.load(f)
          except Exception:
              data = {"matches": []}

          # Filter matches without filtering by severity
          filtered_matches = data.get("matches", [])

          doc = SimpleDocTemplate("grype-vulnerability-report.pdf", pagesize=letter, rightMargin=30, leftMargin=30, topMargin=30, bottomMargin=30)
          styles = getSampleStyleSheet()
          story = []

          # Header Title
          title_style = ParagraphStyle(
              'TitleStyle',
              parent=styles['Heading1'],
              fontSize=18,
              spaceAfter=5,
              textColor=colors.HexColor('#1f2937')
          )
          story.append(Paragraph("Grype Vulnerability Report (Critical & High)", title_style))
          story.append(Paragraph("Target: <code>juiceshop.sbom.json</code> | Filtered Total: " + str(len(filtered_matches)), styles['Normal']))
          story.append(Spacer(1, 15))

          # Table Setup
          table_data = [["Vulnerability", "Severity", "Package", "Installed", "Fixed In"]]
              
          for match in filtered_matches:
              vuln = match.get("vulnerability", {})
              id_str = vuln.get("id", "Unknown")
              severity = vuln.get("severity", "Unknown")
                  
              artifact = match.get("artifact", {})
              pkg_name = artifact.get("name", "Unknown")
              pkg_version = artifact.get("version", "Unknown")
                  
              fix = vuln.get("fix", {})
              versions = fix.get("versions", [])
              fixed_in = ", ".join(versions) if versions else "None"
                  
              table_data.append([
                  Paragraph(id_str, styles['Normal']),
                  Paragraph(severity, styles['Normal']),
                  Paragraph(pkg_name, styles['Normal']),
                  Paragraph(pkg_version, styles['Normal']),
                  Paragraph(fixed_in, styles['Normal'])
              ])

          if len(table_data) > 1:
              t = Table(table_data, colWidths=[90, 70, 130, 85, 130])
              t.setStyle(TableStyle([
                  ('BACKGROUND', (0,0), (-1,0), colors.HexColor('#e5e7eb')),
                  ('TEXTCOLOR', (0,0), (-1,0), colors.HexColor('#111827')),
                  ('ALIGN', (0,0), (-1,-1), 'LEFT'),
                  ('FONTNAME', (0,0), (-1,0), 'Helvetica-Bold'),
                  ('BOTTOMPADDING', (0,0), (-1,0), 6),
                  ('GRID', (0,0), (-1,-1), 0.5, colors.HexColor('#d1d5db')),
                  ('ROWBACKGROUNDS', (0,1), (-1,-1), [colors.white, colors.HexColor('#f9fafb')])
              ]))
              story.append(t)
          else:
              story.append(Paragraph("No Critical or High vulnerabilities found.", styles['Normal']))

          doc.build(story)
          print("Filtered PDF generated successfully.")
          EOF

      # 9. Upload PDF Report Artifact
      - name: Upload PDF Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grype-vulnerability-report
          path: grype-vulnerability-report.pdf

      # Install GuardDog via pip
      - name: Install GuardDog & jq
        run: |
          pip3 install guarddog
          sudo apt-get install -y jq
      # Parse package.json and run GuardDog scan on each package name
      - name: Run GuardDog Dependency Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Extracting dependencies from package.json..."
          DEPS=$(jq -r '(.dependencies // {}) + (.devDependencies // {}) | keys[]' package.json)
          if [ -z "$DEPS" ]; then
            echo "No dependencies found to scan."
            exit 0
          fi
          echo "Scanning dependencies with GuardDog..."
          for dep in $DEPS; do
            echo "----------------------------------------"
            echo "Scanning package: $dep"
            # Use 'scan' for remote npm registry packages
            guarddog npm scan "$dep" \
              --exclude-rules metadata_mismatch \
              --exclude-rules potentially_compromised_email_domain \
              --exclude-rules unclaimed_maintainer_email_domain || true
            done
          continue-on-error: true
